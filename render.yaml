services:
  - type: web
    name: voxly-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: FLASK_ENV
        value: production
      - key: VOXLY_SKIP_AUTOCREATE
        value: "false"
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false
      - key: VOXLY_JWT_SECRET
        sync: false
      - key: VOXLY_ALLOWED_ORIGINS
        sync: false
